<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Hanzi Stroke Order Demo</title>

  <!-- Hanzi Writer CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h2>学习汉字</h2>
    <p class="subtitle">Enter Chinese characters to see stroke order</p>

    <div class="input-group">
      <input id="charInput" placeholder="学习汉字" />
      <button id="drawBtn">Draw</button>
    </div>

    <div id="writer"></div>

    <div class="info">
      Enter one or more Chinese characters and click "Draw" to see the stroke order animation
    </div>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
